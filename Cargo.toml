[package]
name = "den-mcp"
version = "0.6.0"
edition = "2021"
description = "Den's MCP server: lets an LLM client (Claude, ChatGPT) search Den's film and series index through den-atlas, behind den-edge's OAuth"
publish = false
license = "MIT"

[[bin]]
name = "den-mcp"
path = "src/main.rs"

[dependencies]
# Single-threaded runtime: every request is a short relay to atlas, so one thread keeps idle RAM minimal.
tokio = { version = "1", features = ["rt", "macros", "net", "time", "sync", "signal"] }
hyper = { version = "1", features = ["server", "client", "http1"] }
# server-graceful: stop accepting on SIGTERM and let in-flight requests finish. client-legacy: the pooled,
# keep-alive client to atlas — plain HTTP on the LAN, so no TLS stack at all.
hyper-util = { version = "0.1", features = ["tokio", "http1", "server-graceful", "client-legacy"] }
http-body-util = "0.1"
bytes = "1"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
sha2 = "0.11"
# join_all, to ask atlas for several things at once. Already built as hyper-util's own dependency.
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "webpki-roots", "ring"] }
# Verifies den-edge's access tokens (EdDSA JWS). Pure Rust; `fast` keeps the precomputed tables that make a
# verify ~50 µs.
ed25519-dalek = { version = "3", default-features = false, features = ["fast"] }
# Library writes (den-spec wire/assistant-v1.md): opening the token's grant key, signing and sealing a request. The
# fleet's one implementation; nothing here hand-rolls a primitive.
den-assistant = { git = "https://github.com/oxyc/den-core.git", tag = "den-assistant-v1.1" }
# The request id and the encapsulation randomness come from the platform's CSPRNG (`SysRng`, as a `CryptoRng`).
getrandom = { version = "0.4", features = ["sys_rng"] }
rand_core = "0.10"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros", "net", "time", "sync", "signal", "test-util", "io-util"] }

# The fleet's release profile: fat LTO, one codegen unit, stripped. panic=unwind so a panic in one request
# unwinds that connection rather than the whole server.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
