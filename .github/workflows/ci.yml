name: ci

# Tests, lints and the formatting check on every push and PR. Every exact main commit also produces a scanned,
# immutable candidate image while its checks run; a release tag only promotes that already-tested digest (see
# docker-publish.yml) and never recompiles or reruns this workflow.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # Superseded PR revisions are disposable. A main SHA is a potential release and its candidate must finish even
  # when another merge follows it, otherwise a tag could name a commit whose exact image was cancelled midway.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  IMAGE: ghcr.io/${{ github.repository_owner }}/den-mcp

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Formatting
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Tests
        run: cargo test --locked

  # The image is what ships, and it builds differently from `cargo build` (musl, scratch). Caught on the PR rather
  # than at tag time, for amd64 — the only arch the box runs. It reads main's cache but does not write it, so an
  # unmerged revision never overwrites the durable release cache.
  build-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read release metadata
        id: source
        run: |
          set -euo pipefail
          version=$(cat VERSION)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::VERSION is not X.Y.Z: $version"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          platforms: linux/amd64
          pull: true
          build-args: |
            DEN_VERSION=${{ steps.source.outputs.version }}
            GIT_REVISION=${{ github.sha }}
          cache-from: type=gha,scope=release-image

  # Main builds, probes and scans an immutable candidate while the test job runs. It is unsigned and never receives
  # :latest here; docker-publish promotes it only after this exact workflow has succeeded.
  candidate:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write  # Trivy's report goes to code scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read release metadata
        id: source
        run: |
          set -euo pipefail
          version=$(cat VERSION)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::VERSION is not X.Y.Z: $version"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
      - name: Build and push the candidate
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:candidate-${{ github.sha }}
          # Re-pull every FROM: a base image served from the build cache is how a release inherits last month's
          # toolchain. The cached layers are still reused when the base digest is unchanged.
          pull: true
          build-args: |
            DEN_VERSION=${{ steps.source.outputs.version }}
            GIT_REVISION=${{ github.sha }}
          cache-from: type=gha,scope=release-image
          cache-to: type=gha,mode=max,scope=release-image
          # SLSA provenance and an SBOM, attached to the image index and so covered by its signature.
          provenance: mode=max
          sbom: true
      - name: Prove the image reports its release version
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          VERSION: ${{ steps.source.outputs.version }}
        run: scripts/probe-image.sh "$IMAGE@$DIGEST" "$VERSION"
      - name: Scan image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          version: v0.74.0
          format: json
          output: trivy.json
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"
      # A CRITICAL with a fixed version available fails here, before a digest record exists for a tag to promote.
      # Unfixed CVEs are ignored. A finding that does not apply goes in .trivyignore with a reason.
      - name: Gate on fixable critical findings
        run: trivy convert --severity CRITICAL --exit-code 1 --format table trivy.json
      - name: Bind this CI run to its candidate digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          jq -n --arg image "$DIGEST" '{image: $image}' > candidate-digests.json
      - name: Save candidate identity for release promotion
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-candidate-${{ github.sha }}
          path: candidate-digests.json
          if-no-files-found: error
          retention-days: 30
      - name: Report for code scanning
        continue-on-error: true
        run: trivy convert --format sarif --output trivy.sarif trivy.json
      - name: Upload scan to code scanning
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        # The report is advisory: a code-scanning outage must not hold a release.
        continue-on-error: true
        with:
          sarif_file: trivy.sarif
          category: trivy-image
